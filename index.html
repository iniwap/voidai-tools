<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 去水印终极版 (Batch ZIP & Lossless)</title>

    <!-- React & Tailwind -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- JSZip for Batch Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* 透明背景棋盘格 */
        .checkerboard {
            background-color: #1e293b;
            background-image: linear-gradient(45deg, #334155 25%, transparent 25%),
                linear-gradient(-45deg, #334155 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #334155 75%),
                linear-gradient(-45deg, transparent 75%, #334155 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 动画 */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-slide-up {
            animation: slideUp 0.3s ease-out forwards;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo } = React;

        // --- Icons ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current) {
                    lucide.icons[name]?.toSvg(iconRef.current); // Manual SVG injection if needed or let Lucide scan
                    lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        // --- Main Component ---
        function App() {
            const [files, setFiles] = useState([]);
            const [masks, setMasks] = useState({ 48: null, 96: null });
            const [systemStatus, setSystemStatus] = useState('init'); // init, ready, error
            const [isZipping, setIsZipping] = useState(false);
            const [previewTarget, setPreviewTarget] = useState(null); // The file object currently being previewed

            // Stats
            const stats = useMemo(() => ({
                total: files.length,
                done: files.filter(f => f.status === 'done').length,
                processing: files.filter(f => f.status === 'processing').length,
                pending: files.filter(f => f.status === 'pending').length
            }), [files]);

            // 1. Initialize & Load Masks
            useEffect(() => {
                lucide.createIcons();

                const loadAsset = (path) => new Promise((resolve, reject) => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.onload = () => resolve(img);
                    img.onerror = () => reject(path);
                    img.src = path;
                });

                Promise.allSettled([loadAsset('./assets/bg_48.png'), loadAsset('./assets/bg_96.png')])
                    .then(([res48, res96]) => {
                        const loadedMasks = {};
                        let hasSuccess = false;

                        if (res48.status === 'fulfilled') { loadedMasks[48] = res48.value; hasSuccess = true; }
                        if (res96.status === 'fulfilled') { loadedMasks[96] = res96.value; hasSuccess = true; }

                        if (hasSuccess) {
                            setMasks(loadedMasks);
                            setSystemStatus('ready');
                        } else {
                            setSystemStatus('error');
                        }
                    });
            }, []);

            // 2. Queue Processor (Watch files)
            useEffect(() => {
                if (systemStatus !== 'ready') return;

                // Process one at a time to prevent UI freeze, or find next pending
                const nextFile = files.find(f => f.status === 'pending');
                const isBusy = files.some(f => f.status === 'processing');

                // Concurrency control: 1 file at a time (safest for JS single thread with heavy canvas ops)
                if (nextFile && !isBusy) {
                    processImage(nextFile);
                }
            }, [files, systemStatus]);

            // 3. Image Processing Logic
            const processImage = async (fileObj) => {
                // Set status to processing
                setFiles(prev => prev.map(f => f.id === fileObj.id ? { ...f, status: 'processing' } : f));

                try {
                    await new Promise(r => setTimeout(r, 20)); // UI Breath

                    const img = await new Promise((resolve, reject) => {
                        const i = new Image();
                        i.onload = () => resolve(i);
                        i.onerror = reject;
                        i.src = fileObj.originalUrl;
                    });

                    // Auto select mask
                    let mask = masks[48];
                    if (img.naturalWidth > 2048 && masks[96]) mask = masks[96];
                    else if (!mask && masks[96]) mask = masks[96];

                    if (!mask) throw new Error("Mask asset missing");

                    // Canvas setup
                    const cvs = document.createElement('canvas');
                    cvs.width = img.naturalWidth;
                    cvs.height = img.naturalHeight;
                    const ctx = cvs.getContext('2d', { willReadFrequently: true });

                    // Draw Original
                    ctx.drawImage(img, 0, 0);
                    const imgData = ctx.getImageData(0, 0, cvs.width, cvs.height);

                    // Draw Mask
                    const mCvs = document.createElement('canvas');
                    mCvs.width = mask.naturalWidth;
                    mCvs.height = mask.naturalHeight;
                    const mCtx = mCvs.getContext('2d');
                    mCtx.drawImage(mask, 0, 0);
                    const mData = mCtx.getImageData(0, 0, mCvs.width, mCvs.height).data;

                    // Calc Position (Bottom Right, Padding 24)
                    const pad = 24;
                    const startX = cvs.width - mCvs.width - pad;
                    const startY = cvs.height - mCvs.height - pad;

                    // Pixel Algo
                    for (let y = 0; y < mCvs.height; y++) {
                        for (let x = 0; x < mCvs.width; x++) {
                            const gX = startX + x;
                            const gY = startY + y;
                            if (gX >= cvs.width || gY >= cvs.height || gX < 0 || gY < 0) continue;

                            const iIdx = (gY * cvs.width + gX) * 4;
                            const mIdx = (y * mCvs.width + x) * 4;

                            let alpha = mData[mIdx + 3] / 255.0;
                            if (alpha < 0.01) continue;
                            if (alpha > 0.95) alpha = 0.95;

                            // Reverse Blend: (C - W*a) / (1-a)
                            // Assuming White Watermark
                            for (let c = 0; c < 3; c++) {
                                let val = (imgData.data[iIdx + c] - 255 * alpha) / (1 - alpha);
                                imgData.data[iIdx + c] = Math.min(255, Math.max(0, val));
                            }
                        }
                    }

                    ctx.putImageData(imgData, 0, 0);

                    // Export Blob
                    cvs.toBlob(blob => {
                        const resultUrl = URL.createObjectURL(blob);
                        setFiles(prev => prev.map(f => f.id === fileObj.id ? {
                            ...f,
                            status: 'done',
                            resultUrl: resultUrl,
                            resultBlob: blob,
                            dims: `${cvs.width}x${cvs.height}`
                        } : f));
                    }, 'image/png');

                } catch (err) {
                    console.error(err);
                    setFiles(prev => prev.map(f => f.id === fileObj.id ? {
                        ...f, status: 'error', errorMsg: "处理失败"
                    } : f));
                }
            };

            // 4. Handlers
            const handleUpload = (e) => {
                const newFiles = Array.from(e.target.files || []).map(file => ({
                    id: crypto.randomUUID(),
                    file: file,
                    name: file.name,
                    originalUrl: URL.createObjectURL(file),
                    status: 'pending', // pending, processing, done, error
                    resultUrl: null,
                    resultBlob: null
                }));
                setFiles(prev => [...prev, ...newFiles]);
                // Reset file input
                e.target.value = '';
            };

            const handleDelete = (id) => {
                setFiles(prev => {
                    const target = prev.find(f => f.id === id);
                    if (target) {
                        URL.revokeObjectURL(target.originalUrl);
                        if (target.resultUrl) URL.revokeObjectURL(target.resultUrl);
                    }
                    return prev.filter(f => f.id !== id);
                });
                if (previewTarget?.id === id) setPreviewTarget(null);
            };

            const handleClearAll = () => {
                if (!confirm('确定要清空所有图片吗？')) return;
                files.forEach(f => {
                    URL.revokeObjectURL(f.originalUrl);
                    if (f.resultUrl) URL.revokeObjectURL(f.resultUrl);
                });
                setFiles([]);
                setPreviewTarget(null);
            };

            const handleZipDownload = async () => {
                const finishedFiles = files.filter(f => f.status === 'done');
                if (finishedFiles.length === 0) return;

                setIsZipping(true);
                try {
                    const zip = new JSZip();
                    const nameCounts = {};

                    finishedFiles.forEach(f => {
                        let fileName = f.name;

                        // Handle duplicate names in zip
                        if (nameCounts[fileName]) {
                            nameCounts[fileName]++;
                            const extIndex = fileName.lastIndexOf('.');
                            const name = fileName.substring(0, extIndex);
                            const ext = fileName.substring(extIndex);
                            fileName = `${name} (${nameCounts[fileName]})${ext}`;
                        } else {
                            nameCounts[fileName] = 0;
                        }

                        zip.file(fileName, f.resultBlob);
                    });

                    const content = await zip.generateAsync({ type: "blob" });

                    // Trigger download
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(content);
                    link.download = "gemini_cleaned_images.zip";
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(link.href);

                } catch (e) {
                    alert('打包失败: ' + e.message);
                } finally {
                    setIsZipping(false);
                }
            };

            // Drop zone
            const handleDrop = (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    const newFiles = Array.from(e.dataTransfer.files)
                        .filter(f => f.type.startsWith('image/'))
                        .map(file => ({
                            id: crypto.randomUUID(),
                            file: file,
                            name: file.name,
                            originalUrl: URL.createObjectURL(file),
                            status: 'pending',
                            resultUrl: null,
                            resultBlob: null
                        }));
                    setFiles(prev => [...prev, ...newFiles]);
                }
            };

            return (
                <div
                    className="min-h-screen flex flex-col"
                    onDragOver={(e) => { e.preventDefault(); }}
                    onDrop={handleDrop}
                >
                    {/* --- Top Bar (New) --- */}
                    <div className="bg-slate-950 border-b border-slate-800 py-1.5 px-4 text-center text-xs text-slate-400">
                        <span className="opacity-75">版权信息 </span>
                        <a
                            href="https://aiforge.taobao.com/"
                            target="_blank"
                            className="text-blue-400 hover:text-blue-300 hover:underline mx-1 font-medium transition-colors"
                        >
                            墨智工坊
                        </a>
                        <span className="mx-3 text-slate-700">|</span>
                        <span className="opacity-75">官方微信公众号：AI夜航员</span>
                    </div>

                    {/* --- Header --- */}
                    <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 backdrop-blur-md bg-opacity-80">
                        <div className="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-4">
                                <div className="bg-gradient-to-br from-blue-500 to-purple-600 w-10 h-10 rounded-lg flex items-center justify-center shadow-lg shadow-blue-500/20">
                                    <Icon name="sparkles" className="text-white" />
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold tracking-tight text-white">Gemini Cleaner Pro</h1>
                                    <div className="flex items-center gap-2 text-xs">
                                        {systemStatus === 'ready' ? (
                                            <span className="text-green-400 flex items-center gap-1"><Icon name="check-circle-2" size={12} /> 系统就绪 (自动匹配Mask)</span>
                                        ) : systemStatus === 'error' ? (
                                            <span className="text-red-400 flex items-center gap-1"><Icon name="alert-triangle" size={12} /> 错误: 缺少 assets/bg_48.png</span>
                                        ) : (
                                            <span className="text-slate-500">初始化中...</span>
                                        )}
                                    </div>
                                </div>
                            </div>

                            <div className="flex items-center gap-3">
                                <span className="hidden md:block text-slate-400 text-sm mr-2">
                                    {stats.done} / {stats.total} 完成
                                </span>

                                {/* Upload Button */}
                                <input type="file" id="upload" multiple accept="image/*" className="hidden" onChange={handleUpload} />
                                <label
                                    htmlFor="upload"
                                    className={`flex items-center gap-2 px-5 py-2.5 rounded-lg font-medium transition-all cursor-pointer border border-slate-700 hover:border-blue-500 hover:bg-slate-800 text-slate-200 ${systemStatus !== 'ready' ? 'opacity-50 pointer-events-none' : ''}`}
                                >
                                    <Icon name="upload-cloud" size={18} />
                                    <span className="hidden sm:inline">添加图片</span>
                                </label>

                                {/* Zip Download Button */}
                                <button
                                    onClick={handleZipDownload}
                                    disabled={stats.done === 0 || isZipping}
                                    className={`flex items-center gap-2 px-5 py-2.5 rounded-lg font-medium transition-all shadow-lg ${stats.done === 0
                                        ? 'bg-slate-800 text-slate-600 cursor-not-allowed'
                                        : 'bg-blue-600 hover:bg-blue-500 text-white shadow-blue-600/20'
                                        }`}
                                >
                                    {isZipping ? <Icon name="loader-2" className="animate-spin" /> : <Icon name="archive" size={18} />}
                                    <span className="hidden sm:inline">{isZipping ? '打包中...' : '打包下载 (ZIP)'}</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* --- Main Content --- */}
                    <main className="flex-1 max-w-7xl mx-auto w-full p-6">

                        {/* Empty State */}
                        {files.length === 0 && (
                            <div className="h-[60vh] flex flex-col items-center justify-center border-2 border-dashed border-slate-800 rounded-3xl bg-slate-900/30 text-slate-500">
                                <div className="p-6 bg-slate-800/50 rounded-full mb-6">
                                    <Icon name="image-plus" size={48} className="opacity-50" />
                                </div>
                                <h2 className="text-xl font-medium text-slate-300 mb-2">拖入图片 或 点击右上角添加</h2>
                                <p className="text-sm opacity-60">支持批量上传 • 自动队列处理 • 无损原名导出</p>
                            </div>
                        )}

                        {/* Grid Gallery */}
                        {files.length > 0 && (
                            <>
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-slate-400 text-sm font-medium">任务列表</h2>
                                    <button onClick={handleClearAll} className="text-xs text-red-400 hover:text-red-300 flex items-center gap-1 transition-colors px-3 py-1 rounded hover:bg-red-900/20">
                                        <Icon name="trash-2" size={14} /> 清空列表
                                    </button>
                                </div>

                                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 pb-20">
                                    {files.map(file => (
                                        <div
                                            key={file.id}
                                            className="group relative aspect-square bg-slate-800 rounded-xl overflow-hidden border border-slate-700 hover:border-slate-500 transition-all shadow-sm hover:shadow-xl animate-slide-up"
                                        >
                                            {/* Image Thumb */}
                                            <div className="w-full h-full checkerboard relative cursor-pointer" onClick={() => file.status === 'done' && setPreviewTarget(file)}>
                                                <img
                                                    src={file.status === 'done' ? file.resultUrl : file.originalUrl}
                                                    className={`w-full h-full object-cover transition-all duration-500 ${file.status === 'processing' ? 'scale-105 blur-sm' : ''}`}
                                                    loading="lazy"
                                                />
                                            </div>

                                            {/* Status Badge (Top Left) */}
                                            <div className="absolute top-2 left-2 z-10">
                                                {file.status === 'processing' && (
                                                    <div className="bg-blue-600/90 text-white text-[10px] px-2 py-0.5 rounded-full flex items-center gap-1 backdrop-blur-sm shadow-lg">
                                                        <Icon name="loader-2" size={10} className="animate-spin" /> 处理中
                                                    </div>
                                                )}
                                                {file.status === 'done' && (
                                                    <div className="bg-green-600/90 text-white text-[10px] px-2 py-0.5 rounded-full flex items-center gap-1 backdrop-blur-sm shadow-lg">
                                                        <Icon name="check" size={10} /> 完成
                                                    </div>
                                                )}
                                                {file.status === 'error' && (
                                                    <div className="bg-red-600/90 text-white text-[10px] px-2 py-0.5 rounded-full backdrop-blur-sm shadow-lg">失败</div>
                                                )}
                                            </div>

                                            {/* Hover Overlay Actions */}
                                            <div className="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity duration-200 flex flex-col items-center justify-center gap-3 backdrop-blur-[2px]">
                                                {file.status === 'done' && (
                                                    <button
                                                        onClick={() => setPreviewTarget(file)}
                                                        className="p-2.5 bg-white text-slate-900 rounded-full hover:scale-110 transition-transform shadow-lg"
                                                        title="预览"
                                                    >
                                                        <Icon name="eye" size={20} />
                                                    </button>
                                                )}
                                                <button
                                                    onClick={(e) => { e.stopPropagation(); handleDelete(file.id); }}
                                                    className="p-2.5 bg-red-500 text-white rounded-full hover:bg-red-600 hover:scale-110 transition-all shadow-lg"
                                                    title="删除"
                                                >
                                                    <Icon name="trash-2" size={20} />
                                                </button>
                                            </div>

                                            {/* Filename Footer */}
                                            <div className="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/90 to-transparent p-3 pt-6 pointer-events-none">
                                                <p className="text-xs text-slate-200 truncate font-mono">{file.name}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </>
                        )}
                    </main>

                    {/* --- Preview Modal --- */}
                    {previewTarget && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/95 backdrop-blur-md animate-fade-in p-4" onClick={() => setPreviewTarget(null)}>
                            <div className="relative max-w-7xl max-h-full w-full h-full flex flex-col" onClick={e => e.stopPropagation()}>

                                {/* Modal Header */}
                                <div className="flex justify-between items-center mb-4 shrink-0">
                                    <div className="flex flex-col">
                                        <h3 className="text-white font-medium text-lg">{previewTarget.name}</h3>
                                        <p className="text-slate-400 text-xs">
                                            {previewTarget.dims} • 按住图片对比原图
                                        </p>
                                    </div>
                                    <div className="flex gap-3">
                                        <a
                                            href={previewTarget.resultUrl}
                                            download={previewTarget.name} // 原名下载
                                            className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-medium flex items-center gap-2 transition-colors"
                                        >
                                            <Icon name="download" size={16} /> 单张下载
                                        </a>
                                        <button
                                            onClick={() => setPreviewTarget(null)}
                                            className="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition-colors"
                                        >
                                            <Icon name="x" size={20} />
                                        </button>
                                    </div>
                                </div>

                                {/* Comparison View */}
                                <div className="flex-1 relative rounded-xl overflow-hidden border border-slate-700 checkerboard group select-none">
                                    <CompareImage
                                        original={previewTarget.originalUrl}
                                        processed={previewTarget.resultUrl}
                                    />
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- Helper Component: Press to Compare ---
        function CompareImage({ original, processed }) {
            const [showOriginal, setShowOriginal] = useState(false);

            return (
                <div
                    className="w-full h-full relative flex items-center justify-center cursor-crosshair"
                    onMouseDown={() => setShowOriginal(true)}
                    onMouseUp={() => setShowOriginal(false)}
                    onMouseLeave={() => setShowOriginal(false)}
                    onTouchStart={() => setShowOriginal(true)}
                    onTouchEnd={() => setShowOriginal(false)}
                >
                    <img
                        src={showOriginal ? original : processed}
                        className="max-w-full max-h-full object-contain shadow-2xl"
                        draggable={false}
                    />

                    {/* Floating Label */}
                    <div className="absolute top-4 left-1/2 -translate-x-1/2 bg-black/70 backdrop-blur-md text-white text-xs px-4 py-1.5 rounded-full pointer-events-none border border-white/10 font-medium tracking-wide">
                        {showOriginal ? (
                            <span className="text-amber-400">原始图片 (ORIGINAL)</span>
                        ) : (
                            <span className="text-green-400">已去水印 (CLEANED)</span>
                        )}
                    </div>

                    <div className="absolute bottom-6 text-white/50 text-xs pointer-events-none animate-pulse">
                        按住鼠标/手指 查看对比
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
