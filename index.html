<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoidAI Tools - 墨智工坊</title>

    <link rel="icon" href="assets/icons/favicon.png" type="image/png">

    <!-- 全局样式 -->
    <script src="./js/libs/tailwindcss.js"></script>
    <link rel="stylesheet" href="css/style.css">

    <!-- 核心依赖 (CDN) -->
    <!-- React Core -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="./js/libs/babel.min.js"></script>

    <!-- Styling & Icons -->
    <script src="./js/libs/lucide.min.js"></script>

    <!-- Core Libraries (必需) -->
    <script src="./js/libs/jszip.min.js"></script>
    <script src="./js/libs/gif.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: { 950: '#020617', 900: '#0f172a', 800: '#1e293b' }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-void-950 text-slate-200 h-screen flex flex-col overflow-hidden selection:bg-indigo-500/30">
    <div id="root" class="flex-1 flex flex-col h-full min-h-0"></div>

    <!-- Logic -->
    <script type="text/babel" src="js/components.js"></script>
    <script type="text/babel" src="js/tools/watermark.js"></script>
    <script type="text/babel" src="js/tools/memaker.js"></script>
    <script type="text/babel" src="js/tools/gallery.js"></script>
    <script type="text/babel" src="js/app.js"></script>

</html>
