<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoidAI Tools - 墨智工坊</title>

    <!-- Favicon -->
    <link rel="icon" href="assets/icons/favicon.png" type="image/png">

    <!-- Styles -->
    <script src="./js/libs/tailwindcss.js"></script>
    <link rel="stylesheet" href="css/style.css">

    <!-- Libraries -->
    <!-- 核心依赖 (CDN) -->
    <!-- React Core -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="./js/libs/babel.min.js"></script>

    <!-- Styling & Icons -->
    <script src="./js/libs/lucide.min.js"></script>

    <!-- Core Libraries (必需) -->
    <script src="./js/libs/jszip.min.js"></script>
    <script src="./js/libs/gif.js"></script>

    <!-- Tailwind Theme Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: { 950: '#020617', 900: '#0f172a', 800: '#1e293b' },
                        brand: { pink: '#FFB7B2', blue: '#A2E1DB', purple: '#E2F0CB' }
                    },
                    fontFamily: {
                        sans: ['"Segoe UI"', 'system-ui', 'sans-serif'],
                        mono: ['"Fira Code"', 'monospace']
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-void-950 text-slate-200 h-screen flex flex-col overflow-hidden">
    <div id="root" class="flex-1 flex flex-col h-full"></div>

    <!-- Scripts (Order Matters) -->
    <script type="text/babel" src="js/components.js"></script>
    <script type="text/babel" src="js/tools/watermark.js"></script>
    <script type="text/babel" src="js/tools/memaker.js"></script>
    <script type="text/babel" src="js/tools/gallery.js"></script>
    <script type="text/babel" src="js/app.js"></script>
</body>

</html>
